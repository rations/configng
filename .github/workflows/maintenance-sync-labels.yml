name: "Maintenance: Sync labels"
run-name: Sync Labels from YML on ${{ github.event_name }}

# Pivuan: started by hand only (Actions minutes): no push, pull request or schedule triggers.
on:
  workflow_dispatch:

jobs:
  labeler:
    permissions:
      contents: read # for actions/labeler to determine modified files
      pull-requests: write # for actions/labeler to add labels to PRs
      issues: write # for actions/labeler to add labels to issues

    if: ${{ github.repository_owner == 'Armbian' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Labeler
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          dry-run: ${{ github.event_name == 'pull_request' }}
          exclude: |
            Maintenance*
