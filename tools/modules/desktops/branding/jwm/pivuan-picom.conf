# Pivuan Audio: picom, the compositor. Installed as /etc/pivuan/picom.conf by
# pivuan-config; JWM starts picom with it (/etc/jwm/pivuan.jwmrc). Its own file,
# so picom does not read /etc/xdg/picom.conf (shadows, fading, see-through
# window frames): each of those is GPU work on every window move.
#
# To try other settings, copy this file to ~/.config/picom.conf, change it, and
# run: pkill picom; picom -b --config ~/.config/picom.conf

# XRender, in step with the screen (no tearing). The X server draws it on the
# Pi's GPU (glamor on V3D); on the Pi 5 it moves windows much more smoothly than
# picom's OpenGL backend (glx), which is slow there.
backend = "xrender";
vsync = true;

# Plain windows, as without a compositor.
shadow = false;
fading = false;
frame-opacity = 1.0;
inactive-opacity = 1.0;
active-opacity = 1.0;
corner-radius = 0;
blur-background = false;
detect-client-opacity = true;

# Full-screen programs stay composited: no flicker when they start and stop.
unredir-if-possible = false;
