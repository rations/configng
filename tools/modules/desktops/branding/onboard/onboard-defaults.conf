# Onboard, the on-screen keyboard of Pivuan Audio for touchscreens. Installed as
# /etc/onboard/onboard-defaults.conf by pivuan-config (postinst/audio.sh). These are
# Onboard's first settings for each user; changes made in Onboard's own Preferences
# are kept per user and win over this file. The keys are Onboard's gsettings keys
# (org.onboard), as in /usr/share/doc/onboard/onboard-defaults.conf.example.gz.
#
# The panel's keyboard button and System > On-screen Keyboard show and hide it
# (/usr/lib/pivuan/keyboard). Keys start in column 0.

[main]
layout=Compact
# Dark, like the rest of Pivuan Audio.
theme=Nightshade
key-label-font=DejaVu Sans
# Started hidden at login; the panel button shows it.
start-minimized=True
# The panel has its own keyboard button, so no second icon in the tray.
show-status-icon=False
# Not inside a screen saver: Pivuan Audio has none.
xembed-onboard=False

[window]
# Docked along the bottom, above JWM's panel, and maximized windows end above it, so
# the keyboard never covers what is being typed into.
docking-enabled=True
docking-edge=bottom
docking-shrink-workarea=True
force-to-top=True

[auto-show]
# Off: auto-show follows the focused text field through the accessibility bus, which
# most of the audio programs (drawn on plain X11, not GTK) do not use, so it would
# work in some windows and not others. Use the panel button.
enabled=False

[typing-assistance.word-suggestions]
enabled=False
