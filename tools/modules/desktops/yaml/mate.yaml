name: mate
description: "MATE - traditional GNOME 2 desktop"
display_manager: lightdm
status: supported

tiers:
  minimal:
    packages:
      - mate-desktop-environment
      - mate-desktop-environment-extras
      - mate-terminal
      - lightdm
      - slick-greeter
      - xserver-xorg
      - blueman
      - bluez
      - bluez-tools
      - network-manager-gnome
      - dbus-x11
      - dmz-cursor-theme
      - evince
      - fonts-ubuntu
      - gnome-disk-utility
      - gnome-system-monitor
      - gtk2-engines
      - gtk2-engines-murrine
      - gtk2-engines-pixbuf
      - gvfs-backends
      - libpam-gnome-keyring
      - lm-sensors
      - numix-gtk-theme
      - numix-icon-theme
      - numix-icon-theme-circle
      - pavucontrol
      - printer-driver-all
      - pulseaudio
      - pulseaudio-module-bluetooth
      - spice-vdagent
      - system-config-printer
      - viewnior
      - xdg-user-dirs
      - xdg-user-dirs-gtk
    # mate-terminal is the terminal; no need for terminator from common.yaml
    packages_remove:
      - terminator
      - brisk-menu
      - mate-applet-trash
    packages_uninstall:
      - mate-indicator-applet
      - mate-indicator-applet-common

# Devuan (sysvinit): applied after the Debian base release's block. Same
# approach as xfce.yaml. PipeWire is started by systemd user units on Debian;
# without systemd, PulseAudio (started by the desktop session) is the
# dependable choice.
devuan:
  packages_remove:
    - xserver-xorg            # XLibre instead (below)
    - pipewire-audio
    - pipewire-pulse
    - wireplumber
  packages:
    - pulseaudio
    - pulseaudio-module-bluetooth
    - mate-polkit             # password dialog for polkit (NetworkManager, disks, shutdown), autostarted in MATE
    # X server: XLibre from the Pivuan apt repository, as on Pivuan Audio (audio.yaml),
    # instead of Xorg: its core (modesetting driver and glamor) and libinput.
    - xserver-xlibre-core
    - xserver-xlibre-input-libinput
    - x11-xkb-utils
    - keyboard-configuration
    - libgl1-mesa-dri         # Mesa (V3D) for the modesetting driver's GPU acceleration
    - picom                   # compositor (postinst): smooth window moves, no redraw trails or tearing
    # The Pivuan icon theme (Haiku's icons) from the Pivuan apt repository, to pick in
    # Appearance; Numix stays the default.
    - pivuan-icon-theme
    # The Pivuan boot splash (plymouth theme) from the Pivuan apt repository; images made
    # before it get it here.
    - pivuan-plymouth-theme

releases:
  bookworm:
    architectures: [arm64, amd64, armhf]
    packages:
      - accountsservice
      - libu2f-udev

  trixie:
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - accountsservice
      - libu2f-udev
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  noble:
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - polkitd
      - pkexec
      - libu2f-udev
    packages_uninstall:
      - ubuntu-session

  forky:
    # Debian 14 — pipewire replaces pulseaudio (same as trixie).
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - accountsservice
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  sid:
    # Debian unstable — pipewire replaces pulseaudio (same as trixie/forky).
    # Includes loong64, which is a sid-only Armbian arch.
    architectures: [arm64, amd64, armhf, riscv64, loong64]
    packages:
      - accountsservice
      - libu2f-udev
      - pipewire-audio
      - pipewire-pulse
      - wireplumber
    packages_remove:
      - pulseaudio
      - pulseaudio-module-bluetooth

  # ── Ubuntu 22.04 LTS / 25.10 / 26.04 ──────────────────────────────

  jammy:
    # Ubuntu 22.04 LTS — polkit split available via SRU;
    # pulseaudio remains default on jammy.
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - polkitd
      - pkexec
      - libu2f-udev
    packages_uninstall:
      - ubuntu-session

  resolute:
    # Ubuntu 26.04 LTS — same as questing; pavumeter still absent.
    architectures: [arm64, amd64, armhf, riscv64]
    packages:
      - polkitd
      - pkexec
      - libfido2-1
    packages_remove:
      # pavumeter remains absent from the Ubuntu archive (dropped in plucky).
      - pavumeter
    packages_uninstall:
      - ubuntu-session
