name: audio
description: "Pivuan Audio - JWM desktop for audio production (JACK and PulseAudio, no PipeWire)"
# No display manager: postinst/audio.sh puts the xlogin login screen
# (simple-login-gui) on tty1 in /etc/inittab, and it starts ~/.xinitrc (JWM).
display_manager: none
status: supported
# Pivuan (Devuan, sysvinit) only, and none of common.yaml: its tiers bring
# PipeWire's camera and Bluetooth plug-ins, cups, terminator and netplan,
# none of which belong here. Everything is listed below.
devuan_only: true
inherit_common: false

# X server: XLibre built for Devuan excalibur without backports, from the
# Pivuan apt repository (rations/pivuan, branch xlibre, xlibre/). The Pivuan
# source is already on every Pivuan image, so no other repository is added.

tiers:
  minimal:
    packages:
      # Window manager first: the primary package that marks this desktop installed.
      - jwm
      # X server: XLibre's core (with the modesetting driver the Pi uses, 99-vc4.conf,
      # and glamor) and libinput, not the metapackages with every video driver.
      # keyboard-configuration gives X the keyboard layout set in the wizard.
      - xserver-xlibre-core
      - xserver-xlibre-input-libinput
      - x11-xkb-utils
      - keyboard-configuration
      # Session
      - xinit
      - x11-xserver-utils
      - dbus-x11
      - libgl1-mesa-dri          # Mesa (V3D) for the modesetting driver's GPU acceleration
      - picom                    # compositor: smooth window moves, no redraw trails or tearing
      # Login screen on tty1 (Pivuan apt repository); pulls in seatd
      - simple-login-gui
      # Desktop programs
      - lxterminal
      - pcmanfm
      - mousepad
      - celluloid
      - lxpolkit                 # polkit password dialog (started from ~/.jwmrc)
      - lxrandr
      - lxappearance
      - onboard                  # on-screen keyboard for touchscreens (the panel button)
      - python3-gi              # Desktop Settings (pivuan-desktop-settings): background,
      - gir1.2-gtk-3.0          # panel icons, hiding the panel
      - xdg-utils
      - adwaita-icon-theme
      - pivuan-icon-theme        # the default icons (Haiku's), in the menu and pcmanfm (Pivuan apt repository)
      - numix-icon-theme         # the icons Pivuan's theme lacks (it inherits Numix's)
      - fonts-dejavu-core
      # Disks, removable media and trash in pcmanfm
      - udisks2
      - gvfs-backends
      # Network and Bluetooth (module_desktops hands ifupdown's interfaces to NetworkManager)
      - network-manager
      - network-manager-gnome
      - blueman
      - bluez
      # Audio: JACK for the audio programs, PulseAudio for everything else (HDMI,
      # Bluetooth, the browser). While JACK runs, PulseAudio hands it the sound
      # card and plays into JACK (/usr/lib/pivuan/pulse-session, postinst/audio.sh).
      # The speaker in JWM's tray opens Volume Control (pavucontrol).
      - jackd2
      - alsa-utils
      - alsa-ucm-conf
      - pulseaudio
      - pulseaudio-utils
      - pulseaudio-module-bluetooth
      - pulseaudio-module-jack
      - pavucontrol
      # Pivuan audio applications (Pivuan apt repository)
      - jack-graph
      - jackdaw
      - namp-rations
      - namix
      - lvtuner
      - drumix
      - cpu-power
      # Windows plugins in the audio programs: vstbridge, which brings Wine with FEX
      # (wine-fex) for running Windows programs (Pivuan apt repository)
      - vstbridge

devuan:
  # Browser: Brave Origin from Brave's apt repository (module_desktops).
  brave_package: brave-origin

releases:
  trixie:
    # The Pivuan audio applications are built for arm64 only.
    architectures: [arm64]
